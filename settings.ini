; Screen Reader Assist - portable settings (UTF-8)
[app]
version=1

[reading]
; cursor / manga / selection / off
mode=cursor
dwellMilliseconds=750
ocrFallback=true

[speech]
; rate: -10=slower, 0=normal, +10=faster (21 steps)
rate=0
volume=100
voiceName=""

[ocr]
copyToClipboard=false
reuseLastRegion=false
preferJapanese=true

[magnifier]
zoom=2
