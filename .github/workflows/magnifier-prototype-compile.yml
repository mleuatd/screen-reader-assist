name: Compile 3-screen magnifier C# prototype
on:
  pull_request:
    paths:
      - 'prototypes/Win11MagnifierBase/**'
      - '.github/workflows/magnifier-prototype-compile.yml'
  push:
    branches: [ main ]
    paths:
      - 'prototypes/Win11MagnifierBase/**'
      - '.github/workflows/magnifier-prototype-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-prototype:
    name: PowerShell 5.1でC#試作コードをコンパイル
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: 実際の起動スクリプトと同じ参照でC#コードをコンパイル
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not [Environment]::Is64BitProcess) { throw '64-bit PowerShell is required' }
          $root = Join-Path (Get-Location) 'prototypes/Win11MagnifierBase'
          $mainSource = Get-ChildItem -LiteralPath $root -File -Recurse -Filter 'DedicatedMagnifier.cs' | Select-Object -First 1
          if (-not $mainSource) { throw 'Prototype C# source file missing' }
          $sources = @(
            $mainSource.FullName,
            (Join-Path $mainSource.DirectoryName 'GlobalOcrSelection.cs')
          )
          Add-Type -Path $sources -ReferencedAssemblies @(
            'System.Windows.Forms.dll',
            'System.Drawing.dll',
            'System.Speech.dll',
            'UIAutomationClient.dll',
            'UIAutomationTypes.dll',
            'WindowsBase.dll'
          ) -ErrorAction Stop
          if (-not ('Win11Magnifier.GlobalOcrSelection' -as [type])) {
            throw 'GlobalOcrSelection missing after compilation'
          }
          Write-Host 'C# compilation successful (Japanese OCR and GUI gestures are NOT runtime-tested).'
