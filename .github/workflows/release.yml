name: Publish tagged release
on:
  push:
    tags: [ 'v*' ]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: オフライン動作の監査（通信コードがあればリリースを停止）
        shell: pwsh
        run: ./scripts/Verify-OfflineRuntime.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test and publish
        shell: pwsh
        run: |
          dotnet run --project tests/ScreenReaderAssist.Tests/ScreenReaderAssist.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Do not substitute English results for Japanese OCR/TTS verification.
          foreach ($mode in @('--benchmark-tts-ja', '--ocr-ja')) {
            dotnet run --project tests/ScreenReaderAssist.Tests/ScreenReaderAssist.Tests.csproj -c Release --no-build -- $mode
            $code = $LASTEXITCODE
            if ($code -eq 2) {
              Write-Warning "日本語テスト $mode は未検証（日本語音声・OCR機能がありません）。英語で代替しません。"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "日本語テスト $mode ：未検証（対応する日本語機能がランナーにありません）"
            } elseif ($code -ne 0) {
              throw "日本語テスト $mode 失敗（終了コード $code）"
            } else {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "日本語テスト $mode ：合格"
            }
          }
          dotnet publish src/ScreenReaderAssist/ScreenReaderAssist.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Build-only download. Windows application itself never contacts a server.
          ./scripts/Bundle-OfflineJapaneseModels.ps1 -Destination publish
          if ($LASTEXITCODE -ne 0) { throw 'Offline Japanese models could not be bundled.' }
          $modelFolder=Join-Path (Resolve-Path publish).Path 'models'
          dotnet run --project tests/ScreenReaderAssist.Tests/ScreenReaderAssist.Tests.csproj -c Release --no-build --no-restore -- --paddle-ja $modelFolder
          if ($LASTEXITCODE -ne 0) { throw 'Japanese offline OCR regression failed; release halted.' }
          # Match the CI artifact: include the portable configuration and emergency reset.
          Copy-Item -Path settings.ini -Destination publish/settings.ini -Force
          Copy-Item -Path ResetScreen.cmd -Destination publish/ResetScreen.cmd -Force
          foreach ($required in @('ScreenReaderAssist.exe', 'settings.ini', 'ResetScreen.cmd')) {
            if (-not (Test-Path (Join-Path publish $required))) { throw "Missing release file: $required" }
          }
          Compress-Archive -Path publish\* -DestinationPath ScreenReaderAssist-win-x64.zip
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" ScreenReaderAssist-win-x64.zip --generate-notes --title "Screen Reader Assist ${{ github.ref_name }}"