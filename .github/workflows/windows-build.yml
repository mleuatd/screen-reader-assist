name: Build and smoke test Windows app
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/ScreenReaderAssist/ScreenReaderAssist.csproj
      - name: Compile
        run: dotnet build src/ScreenReaderAssist/ScreenReaderAssist.csproj -c Release --no-restore
      - name: Logic smoke tests
        run: dotnet run --project tests/ScreenReaderAssist.Tests/ScreenReaderAssist.Tests.csproj -c Release
      - name: Measure native offline speech synthesis speed (optional)
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 2
        run: |
          dotnet run --project tests/ScreenReaderAssist.Tests/ScreenReaderAssist.Tests.csproj -c Release --no-build -- --benchmark-tts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish portable zip input
        run: dotnet publish src/ScreenReaderAssist/ScreenReaderAssist.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Add portable INI beside the EXE
        shell: pwsh
        run: |
          Copy-Item -Path settings.ini -Destination publish/settings.ini -Force
          Copy-Item -Path ResetScreen.cmd -Destination publish/ResetScreen.cmd -Force
          if (-not (Test-Path 'publish/ScreenReaderAssist.exe')) { throw 'Missing portable EXE' }
          if (-not (Test-Path 'publish/settings.ini')) { throw 'Missing portable INI' }
          if (-not (Test-Path 'publish/ResetScreen.cmd')) { throw 'Missing emergency display repair' }
      - name: ZIP app
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath ScreenReaderAssist-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenReaderAssist-win-x64
          path: ScreenReaderAssist-win-x64.zip
          if-no-files-found: error