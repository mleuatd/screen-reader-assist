name: Build and smoke test Windows app
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: オフライン動作の静的監査（通信API・クラウドSDKを禁止）
        shell: pwsh
        run: ./scripts/Verify-OfflineRuntime.ps1
      - name: Cドライブ日本語インストーラーの構文と配布要件を監査
        shell: pwsh
        run: ./scripts/Verify-CDriveInstaller.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/ScreenReaderAssist/ScreenReaderAssist.csproj
      - name: Compile
        run: dotnet build src/ScreenReaderAssist/ScreenReaderAssist.csproj -c Release --no-restore
      - name: Logic smoke tests
        run: dotnet run --project tests/ScreenReaderAssist.Tests/ScreenReaderAssist.Tests.csproj -c Release
      - name: 日本語SAPI音声の性能テスト（日本語音声が無い環境は未検証として明記）
        shell: pwsh
        timeout-minutes: 5
        run: |
          dotnet run --project tests/ScreenReaderAssist.Tests/ScreenReaderAssist.Tests.csproj -c Release --no-build -- --benchmark-tts-ja
          $code = $LASTEXITCODE
          if ($code -eq 2) {
            Write-Warning '日本語SAPI音声が無いため、日本語音声性能は未検証です。英語音声で代用しません。'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### 日本語SAPI音声：未検証（ランナーに日本語音声なし）'
            exit 0
          }
          if ($code -ne 0) { throw "日本語SAPI音声の性能テスト失敗（終了コード：$code）" }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### 日本語SAPI音声：性能テスト完了（波形合成のみ・実際の発声遅延は未測定）'
      - name: 日本語Windows OCR統合スモークテスト（日本語OCR未導入は未検証）
        shell: pwsh
        timeout-minutes: 3
        run: |
          dotnet run --project tests/ScreenReaderAssist.Tests/ScreenReaderAssist.Tests.csproj -c Release --no-build -- --ocr-ja
          $code = $LASTEXITCODE
          if ($code -eq 2) {
            Write-Warning 'このWindowsランナーには日本語OCRがありません。日本語OCRの実動作は未検証です。'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### 日本語OCR：未検証（ランナーに日本語OCR機能なし）'
            exit 0
          }
          if ($code -ne 0) { throw "日本語OCRテスト失敗（終了コード：$code）" }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### 日本語OCR：日本語文字でのスモークテスト成功'
      - name: Publish portable zip input
        run: dotnet publish src/ScreenReaderAssist/ScreenReaderAssist.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: 同梱型の日本語高精度OCRモデルを公式配布元からビルド時に取得
        shell: pwsh
        timeout-minutes: 15
        run: ./scripts/Bundle-OfflineJapaneseModels.ps1 -Destination publish
      - name: 配布モデルだけを使ったC#日本語OCR実動作テスト
        shell: pwsh
        timeout-minutes: 8
        run: |
          $models=Join-Path (Resolve-Path publish).Path 'models'
          dotnet run --project tests/ScreenReaderAssist.Tests/ScreenReaderAssist.Tests.csproj -c Release --no-build --no-restore -- --paddle-ja $models
          if ($LASTEXITCODE -ne 0) { throw '日本語ローカルOCRの検証に失敗しました。ZIPは作成しません。' }
      - name: アプリのテストプロセスの外向き通信を遮断して日本語OCRを再検証
        shell: pwsh
        timeout-minutes: 5
        run: |
          $models=Join-Path (Resolve-Path publish).Path 'models'
          ./scripts/Test-OfflineOcrWithFirewall.ps1 -Models $models
      - name: Add portable INI beside the EXE
        shell: pwsh
        run: |
          Copy-Item -Path settings.ini -Destination publish/settings.ini -Force
          Copy-Item -Path ResetScreen.cmd -Destination publish/ResetScreen.cmd -Force
          if (-not (Test-Path 'publish/ScreenReaderAssist.exe')) { throw 'Missing portable EXE' }
          if (-not (Test-Path 'publish/settings.ini')) { throw 'Missing portable INI' }
          if (-not (Test-Path 'publish/ResetScreen.cmd')) { throw 'Missing emergency display repair' }
      - name: Windows PowerShell 5.1 で3画面拡大鏡のC#ソースをコンパイル検証
        shell: pwsh
        run: |
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\Verify-MagnifierSource.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Three-monitor magnifier build failed' }
      - name: 一式を同梱し拡大鏡実行.batを生成
        shell: pwsh
        run: ./scripts/Prepare-OneClickMagnifierZip.ps1 -PublishDirectory publish
      - name: ZIP app
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath ScreenReaderAssist-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenReaderAssist-win-x64
          path: ScreenReaderAssist-win-x64.zip
          if-no-files-found: error
  publish-oneclick-preview:
    # One-time direct-download preview of the user-requested integrated package.
    # Using a non-v* tag prevents conflict with the normal release.yml workflow.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Synchronize magnifier TTS rate') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ScreenReaderAssist-win-x64
          path: preview
      - name: Create public pre-release download independent of ChatGPT attachments
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -s preview/ScreenReaderAssist-win-x64.zip
          gh release create tryout-20261115 preview/ScreenReaderAssist-win-x64.zip --target "$GITHUB_SHA" --prerelease --title "Windows 11 magnifier + offline Japanese OCR (test build)" --notes "Extract ZIP and double-click 拡大鏡実行.bat. Rate gestures are synchronized across the two bundled processes. This is a test build; Windows 11 three-monitor GUI operation is not yet manually certified."

  publish-cdrive-hud-tryout:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'C-drive HUD') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ScreenReaderAssist-win-x64
          path: preview
      - name: Prepare small double-click C-drive installer ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -s preview/ScreenReaderAssist-win-x64.zip
          zip -j -q JapaneseMagnifier-CDrive-Installer.zip "installer/日本語拡大鏡_インストール.bat" installer/Install-Magnifier-CDrive.ps1
          unzip -l JapaneseMagnifier-CDrive-Installer.zip
      - name: Publish Windows 11 Japanese magnifier and installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create tryout-20261115-hud preview/ScreenReaderAssist-win-x64.zip JapaneseMagnifier-CDrive-Installer.zip --target "$GITHUB_SHA" --prerelease --title "Windows 11 Japanese Magnifier - C drive HUD test build" --notes "Windows 11 x64: download the small installer ZIP, extract and run 日本語拡大鏡_インストール.bat. It installs under C:\\Program Files\\日本語拡大鏡, creates a desktop shortcut, and preserves old versions for rollback. Runtime magnification, Japanese OCR and voice are offline. The central zoom/rate display and spoken sample during second-click drag are experimental and require manual three-monitor testing."
